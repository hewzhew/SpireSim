- insert:
    - id: sts-map-view
      name: '@sts-simulator/dsh-player'
    - id: sts-tool-updates
      name: '@sts-simulator/dsh-player/updates'
    - id: preset-sts-a20h
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sts-a20h
        name: 杀戮尖塔 A20H
        description: 每个会话独立跑局，直接查看 Flash 的操作和游戏返回。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You play Slay the Spire through the bound game tools.
              suffix: ''
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: compaction-command
                name: '@deepseek-ai/dsh-command-compact'
          - id: sts-game
            name: '@sts-simulator/dsh-player/native'
