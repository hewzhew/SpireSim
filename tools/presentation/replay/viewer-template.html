<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'">
  <title>SpireSim</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/tabler.min.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
__ICON_SYMBOLS__
<symbol id="i-intent-down" viewBox="0 0 24 24"><path d="M12 3v17m-6-6 6 6 6-6"/></symbol>
<symbol id="i-intent-down-strong" viewBox="0 0 24 24"><path d="M7 3v16m-4-4 4 4 4-4M17 3v16m-4-4 4 4 4-4"/></symbol>
<symbol id="i-intent-escape" viewBox="0 0 24 24"><path d="M10 5H4v14h6m-2-7h13m-4-4 4 4-4 4"/></symbol>
<symbol id="i-intent-sleep" viewBox="0 0 24 24"><path d="M3 5h6l-6 7h6m4 0h8l-8 8h8"/></symbol>
<symbol id="i-intent-stun" viewBox="0 0 24 24"><path d="m8 3 1.5 4.5L14 9l-4.5 1.5L8 15l-1.5-4.5L2 9l4.5-1.5ZM18 13l1 3 3 1-3 1-1 3-1-3-3-1 3-1Z"/></symbol>
<symbol id="i-intent-unknown" viewBox="0 0 24 24"><path d="M9 8a3 3 0 1 1 4 2.8c-1 .4-1 1.2-1 2.2m0 4h.01"/><circle cx="12" cy="12" r="10"/></symbol>
<symbol id="i-intent-idle" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/></symbol>
<symbol id="i-map-chest" viewBox="0 0 24 24"><path d="M4 11V8a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v12H4Zm0 0h16M10 9h4v6h-4Z"/></symbol>
<symbol id="i-map-elite" viewBox="0 0 24 24"><path d="M7 17H5v-6a7 7 0 0 1 14 0v6h-2v4H7Zm3 0v4m4-4v4M8 11h1m6 0h1m-4 2-1 2h2Z"/></symbol>
<symbol id="i-map-boss" viewBox="0 0 24 24"><path d="m3 5 5 5 4-7 4 7 5-5-2 14H5Zm2 14h14"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M8 3h8l-1 6 4 4v2H5v-2l4-4Zm4 12v6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
</defs></svg>
<div class="page">
  <aside class="navbar navbar-vertical navbar-expand-lg sidebar" data-aria="nav.label">
    <div class="container-fluid">
      <div class="brand"><span class="brand-mark" id="brand-mark"></span>SpireSim</div>
      <div class="run-name"><span id="run-icon"></span><strong data-character></strong><span class="ascension">A20</span></div>
      <div class="recording-picker"><select id="recording" class="form-select form-select-sm" data-aria="nav.recording"></select></div>
      <nav class="timeline" id="timeline" data-aria="nav.timeline"></nav>
      <div class="sidebar-bottom" id="record-model">deepseek-flash</div>
    </div>
  </aside>
  <div class="page-wrapper">
    <div class="app-bar"><span data-character></span><span id="crumb-arrow"></span><span data-act></span><select id="language" class="form-select form-select-sm language-select" data-aria="nav.language"><option value="zh-CN">中文</option><option value="en">English</option></select></div>
    <header class="page-header">
      <div class="container-xl"><div class="row align-items-center">
        <div class="col"><div class="title-row"><h1 class="page-title" id="heading"></h1><span class="turn-label" id="turn-label"></span><button type="button" id="map-toggle" class="map-toggle" aria-controls="journey-map" aria-expanded="false" hidden><span id="map-toggle-icon"></span><span data-message="nav.map"></span></button></div></div>
      </div></div>
    </header>
    <main class="page-body"><div class="container-xl">
      <div class="replay-layout" id="replay-layout" data-map-mode="hidden">
      <div class="replay-main">
      <section id="stage" aria-labelledby="heading"></section>
      <details class="raw-record" id="raw-record">
        <summary id="raw-summary"></summary>
        <div class="raw-inner">
          <div class="raw-tabs" role="tablist" data-aria="raw.summary"><button id="tab-calls" data-tab="calls" role="tab" aria-controls="raw-calls" data-message="raw.calls"></button><button id="tab-input" data-tab="input" role="tab" aria-controls="raw-input" data-message="raw.input"></button><button id="tab-output" data-tab="output" role="tab" aria-controls="raw-output" data-message="raw.output"></button></div>
          <div class="raw-panel" id="raw-calls" role="tabpanel" aria-labelledby="tab-calls"></div><div class="raw-panel" id="raw-input" role="tabpanel" aria-labelledby="tab-input" hidden></div><div class="raw-panel" id="raw-output" role="tabpanel" aria-labelledby="tab-output" hidden></div>
        </div>
      </details>
      </div>
      <aside class="map-dock" id="map-dock">
        <section id="journey-map" class="journey-map" data-aria="nav.map" hidden>
          <div class="map-heading">
            <strong data-message="nav.map"></strong><span id="map-location"></span>
            <div class="map-tools">
              <button type="button" id="map-pin" class="map-tool map-pin" aria-pressed="false"><span id="map-pin-icon"></span><span id="map-pin-label"></span></button>
              <button type="button" id="map-close" class="map-tool" data-aria="nav.closeMap"><span id="map-close-icon"></span></button>
            </div>
          </div>
          <div id="map-content"></div>
        </section>
      </aside>
      </div>
    </div></main>
  </div>
</div>
<script type="application/json" id="data">__DEMO_DATA__</script>
<script type="application/json" id="story">__STORY_DATA__</script>
<script src="demo.js"></script>
</body>
</html>
