[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "sts-learning-bridge"
version = "0.1.0"
description = "SpireSim Python environments with public observations and original-game replay verification"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.urls]
Repository = "https://github.com/hewzhew/SpireSim"
Issues = "https://github.com/hewzhew/SpireSim/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "sts_learning_bridge._native"
python-source = "python"
