[package]
name = "sts_java_parity_compare"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sts_java_parity_compare"
path = "src/main.rs"

[[bin]]
name = "sts_java_parity_suite"
path = "src/bin/sts_java_parity_suite.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sts_core = { package = "sts_simulator", path = "../.." }
sts_java_parity_capture = { path = "../sts_java_parity_capture" }
sts_java_parity_live = { path = "../sts_java_parity_live" }
sts_java_parity_protocol = { path = "../sts_java_parity_protocol" }
