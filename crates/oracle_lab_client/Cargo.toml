[package]
name = "oracle_lab_client"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "oracle_lab_client"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
fs2 = "0.4"
oracle_artifact_contract = { path = "../oracle_artifact_contract", default-features = false, features = ["oracle-client", "oracle-host"] }
oracle_lab_protocol = { path = "../oracle_lab_protocol" }
serde = "1.0"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
