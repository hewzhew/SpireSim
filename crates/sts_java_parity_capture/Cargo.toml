[package]
name = "sts_java_parity_capture"
version = "0.1.0"
edition = "2021"
description = "Observe-only CommunicationMod parity-frame collector"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sts_java_parity_protocol = { path = "../sts_java_parity_protocol" }
uuid = { version = "1.18", features = ["v4"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "sts_java_parity_capture"
path = "src/main.rs"
