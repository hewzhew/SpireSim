[package]
name = "sts_parity_lockstep_runner"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autotests = false

[dependencies]
base64 = "0.22"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sts_combat_planner = { path = "../sts_combat_planner" }
sts_complete_turn_view = { path = "../sts_complete_turn_view" }
sts_java_parity_live = { path = "../sts_java_parity_live" }
sts_java_parity_protocol = { path = "../sts_java_parity_protocol" }
sts_java_parity_runtime = { path = "../sts_java_parity_runtime" }
sts_oracle_run_control = { path = "../sts_oracle_run_control", default-features = false }
sts_oracle_learning = { path = "../sts_oracle_learning" }
sts_parity_lockstep = { path = "../sts_parity_lockstep" }
sts_parity_lockstep_java = { path = "../sts_parity_lockstep_java" }
sts_parity_lockstep_rust = { path = "../sts_parity_lockstep_rust" }
sts_workbench_supervisor = { path = "../sts_workbench_supervisor" }
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
sts_complete_turn_env = { path = "../sts_complete_turn_env" }

[[bin]]
name = "sts_lockstep"
path = "src/main.rs"

[[test]]
name = "combat_draft_lockstep"
path = "tests/combat_draft_lockstep.rs"

[[test]]
name = "mechanism_oracle"
path = "tests/mechanism_oracle.rs"
