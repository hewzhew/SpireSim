[package]
name = "sts_combat_atomic"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autotests = false

[lib]
# This package is a thin compilation owner for retained source modules and has
# no crate-level rustdoc examples. Avoid launching an empty doctest target.
doctest = false

[dependencies]
sts_core = { package = "sts_simulator", path = "../.." }
sts_card_semantics = { path = "../sts_card_semantics" }
sts_combat_evidence = { path = "../sts_combat_evidence" }
sts_combat_knowledge = { path = "../sts_combat_knowledge" }
sts_combat_outcome = { path = "../sts_combat_outcome" }
sts_combat_tactics = { path = "../sts_combat_tactics" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
