[package]
name = "sts_workbench_supervisor"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sts_content_bundle = { path = "../sts_content_bundle" }
uuid = { version = "1.18", features = ["v4"] }

[[test]]
name = "engine_process_contract"
path = "tests/engine_process_contract.rs"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
