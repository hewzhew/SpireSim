[package]
name = "sts_oracle_learning_env"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autotests = false

[lib]
path = "src/lib.rs"

[dependencies]
sts_oracle_run_control = { path = "../sts_oracle_run_control", default-features = false }
sts_oracle_strategic_owner = { path = "../sts_oracle_strategic_owner" }
sts_combat_knowledge = { path = "../sts_combat_knowledge" }
sts_combat_planner = { path = "../sts_combat_planner" }
sts_combat_strategy = { path = "../sts_combat_strategy" }
sts_guided_search = { path = "../sts_guided_search" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
