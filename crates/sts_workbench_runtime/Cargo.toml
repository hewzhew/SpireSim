[package]
name = "sts_workbench_runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
oracle_artifact_contract = { path = "../oracle_artifact_contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sts_paired_root = { path = "../sts_paired_root" }
sts_java_parity_live = { path = "../sts_java_parity_live" }
sts_java_parity_runtime = { path = "../sts_java_parity_runtime" }
sts_java_parity_projection = { path = "../sts_java_parity_projection" }
sts_java_parity_protocol = { path = "../sts_java_parity_protocol" }
sts_workbench_artifact_store = { path = "../sts_workbench_artifact_store" }
sts_workbench_engine_protocol = { path = "../sts_workbench_engine_protocol" }
sts_workbench_supervisor = { path = "../sts_workbench_supervisor" }
uuid = { version = "1.18", features = ["v4"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "sts_workbench_actor"
path = "src/main.rs"

[[bin]]
name = "sts_workbenchd"
path = "src/launcher_main.rs"
