[package]
name = "sts_java_parity_live"
version = "0.1.0"
edition = "2021"
description = "Durable live control bridge for CommunicationMod parity sessions"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sts_java_parity_protocol = { path = "../sts_java_parity_protocol" }
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "sts_java_parity_live"
path = "src/main.rs"
