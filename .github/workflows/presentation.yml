name: Presentation resources

on:
  push:
    paths:
      - 'tools/presentation/**'
      - 'tools/dsh_player/**'
      - 'tools/run_play/**'
      - 'src/content/**'
      - 'src/state/events/mod.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/presentation.yml'
  pull_request:
    paths:
      - 'tools/presentation/**'
      - 'tools/dsh_player/**'
      - 'tools/run_play/**'
      - 'src/content/**'
      - 'src/state/events/mod.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/presentation.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/presentation/package-lock.json
      - run: npm ci
        working-directory: tools/presentation
      - run: npm test
        working-directory: tools/presentation
      - run: npm ci
        working-directory: tools/dsh_player
      - run: npm ci
        working-directory: tools/run_play
      - run: npm run test:client
        working-directory: tools/dsh_player
      - run: node --test tools/run_play/client.test.mjs tools/run_play/workbench.test.mjs tools/dsh_player/native-control.test.mjs
      - run: node --test --test-name-pattern='chat binding|bundle distribution' tools/dsh_player/native.test.mjs
      - run: npm run pack:distribution -- --output "${{ runner.temp }}/sts-node-distribution"
        working-directory: tools/dsh_player
  native-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p sts_presentation
