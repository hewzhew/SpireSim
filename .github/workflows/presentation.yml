name: Presentation resources

on:
  push:
    paths:
      - 'tools/presentation/**'
      - 'tools/dsh_player/**'
      - 'tools/run_play/**'
      - 'src/content/**'
      - 'src/state/events/mod.rs'
      - '.github/workflows/presentation.yml'
  pull_request:
    paths:
      - 'tools/presentation/**'
      - 'tools/dsh_player/**'
      - 'tools/run_play/**'
      - 'src/content/**'
      - 'src/state/events/mod.rs'
      - '.github/workflows/presentation.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/presentation/package-lock.json
      - run: npm ci
        working-directory: tools/presentation
      - run: npm test
        working-directory: tools/presentation
      - run: npm ci
        working-directory: tools/dsh_player
      - run: npm run test:map
        working-directory: tools/dsh_player
